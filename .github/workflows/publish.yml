# Builds the hosted Pit Wall, adds newly finished sessions, and deploys to Firebase.
#
# One-time setup (see README "Hosting on Firebase"):
#   - Repository variable FIREBASE_PROJECT_ID  (Settings → Secrets and variables → Actions → Variables)
#   - Repository secret   FIREBASE_SERVICE_ACCOUNT (the JSON key from Firebase → Project settings → Service accounts)
# Until both exist, this workflow does nothing.
name: Publish Pit Wall

on:
  push:
    branches: [main]
  schedule:
    # Every 4 hours; new sessions are picked up ~2 hours after they finish.
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Add every finished session from this season (e.g. 2026). Leave empty for just recent ones.'
        required: false
      session_keys:
        description: 'Or specific OpenF1 session keys, separated by spaces'
        required: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -z "$PROJECT" ] || [ "$HAS_KEY" != "true" ]; then
            echo "Firebase isn't set up for this repository yet; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.setup.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      # Published race files carry over between runs; on a cold cache they're fetched back from the live site.
      - name: Restore published races
        if: steps.setup.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: site-data
          key: site-data-${{ github.run_id }}
          restore-keys: site-data-

      - name: Add new sessions
        id: data
        if: steps.setup.outputs.ready == 'true'
        env:
          SEASON: ${{ inputs.season }}
          SESSION_KEYS: ${{ inputs.session_keys }}
        run: |
          # Each run stops starting new downloads after 80 minutes (the job limit is 2 hours) and
          # publishes what it has; the next run carries on. Normally: the last 3 race weekends plus
          # anything new. A season typed in when running it by hand adds that whole season.
          ARGS="--site https://$PROJECT.web.app --budget-minutes 80 --max 200"
          if [[ "$SEASON" =~ ^[0-9]{4}$ ]]; then ARGS="$ARGS --season $SEASON"
          elif [ -z "$SESSION_KEYS" ]; then ARGS="$ARGS --last-meetings 3"; fi
          for k in $SESSION_KEYS; do
            if [[ "$k" =~ ^[0-9]+$ ]]; then ARGS="$ARGS --session-key $k"; fi
          done
          npm run publish:data -- $ARGS

      - name: Save published races
        if: steps.setup.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: site-data
          key: site-data-${{ github.run_id }}

      - name: Build site
        if: steps.setup.outputs.ready == 'true' && (github.event_name != 'schedule' || steps.data.outputs.changed == 'true')
        run: |
          node scripts/write-db-rules.mjs
          npm run build:hosted

      - name: Deploy to Firebase
        if: steps.setup.outputs.ready == 'true' && (github.event_name != 'schedule' || steps.data.outputs.changed == 'true')
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --only hosting,database --project "$PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
